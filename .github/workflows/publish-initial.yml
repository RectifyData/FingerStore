name: Publish initial FingerStore prerelease
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  publish-initial:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[publish-v1.4.2]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v4.2.2
      - name: Install BusyBox
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y busybox
      - name: Validate scripts, source and tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build.py --check
          for script in *.sh bin/*.sh; do sh -n "$script"; bash -n "$script"; busybox ash -n "$script"; done
          for test in tests/test_*.py; do python3 "$test"; done
          for test in tests/test_*.cjs; do node "$test"; done
          python3 scripts/build.py
          python3 tests/test_release.py
          (cd dist && sha256sum -c SHA256SUMS)
          test "$(sed -n 's/^version=//p' module.prop)" = "1.4.2"
          test "$(sed -n 's/^versionCode=//p' module.prop)" = "142"
      - name: Validate and publish immutable KernelSU prerelease
        id: release
        uses: KernelSU-Modules/tools/actions/module-release@e0ac1a6193e698beac3c2fc47dec88d180efca8a
        with:
          zip: dist/FingerStore-v1.4.2-module.zip
          manifest: module.yaml
          tag: v1.4.2
          prerelease: 'true'
          release-notes-file: CHANGELOG.md
          require-immutable: 'true'
      - name: Report published release
        env:
          RELEASE_URL: ${{ steps.release.outputs.release-url }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        run: |
          echo "Release: ${RELEASE_URL}"
          echo "SHA256: ${SHA256}"
